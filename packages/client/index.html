<!doctype html>
<html lang="en" data-style="aquatint">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <title>Quarterdeck — Windward &amp; Leeward</title>
      <link rel="stylesheet" href="./src/styles.css" />
      <style>
         html,
         body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            }
     </style>
    </head>
   <body>
      <!-- 3D Renderer -->
      <div id="viewport" style="position:fixed;inset:0"></div>

      <!-- HUD (filled by ui.js; the panels are built dynamically) -->
      <div id="hud" style="position:fixed;inset:0;pointer-events:none"></div>
      <!-- 2D compass overlay -->
      <canvas id="compass" style="position:fixed;right:14px;top:14px;width:160px;height:160px;opacity:.95;pointer-events:none"></canvas>

      <!-- Menu panel (start menu / pause) -->
      <div id="menu" style="display:none"></div>

      <script type="module" src="./src/main.js"></script>
    </body>
   </html>
