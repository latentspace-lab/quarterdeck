name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18+ provides TypeScript stripping without a flag - the tests
          # import packages/server/src/headless.ts directly.
          node-version: 22
          cache: npm
      - run: npm ci

      # Types first: a type error shouldn't show up as a test failure.
      - name: Check types
        run: npm run typecheck

      # Fast levels first - they surface most failures in under a second
      # and keep the log readable.
      - name: Unit tests
        run: npm run test:unit

      - name: Regression tests
        run: npm run test:regression

      # The boot smoke test runs the BUILT game in the browser - so it needs
      # the build and Chromium. Without either, it skips itself.
      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration
